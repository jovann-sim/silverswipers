<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverswipers Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #1E2B2A; font-family: Lexend, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 10px 16px; }
  .bar label { font-size: 14px; color: #C9D8D6; }
  .bar select, .bar button { font: inherit; font-size: 15px; min-height: 40px; border-radius: 10px; border: 1px solid #4A5A58; background: #2C3B3A; color: #FFFFFF; padding: 0 12px; cursor: pointer; }
  .stage { flex: 1; width: 100%; display: flex; align-items: flex-start; justify-content: center; min-height: 0; }
  .phone-wrap { transform-origin: top center; }
  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #F4F8F7; box-shadow: 0 0 0 10px #0B1211, 0 20px 60px rgba(0,0,0,0.5); position: relative; }
  #screen { width: 390px; height: 844px; }
  #screen a { color: #0E4D4A; }
  #screen button { font-family: inherit; }
</style>
</head>
<body>
<div class="bar">
  <label for="jump">Jump to screen</label>
  <select id="jump"><option value="Verify">1 · Welcome + Singpass</option><option value="Main">2 · AI voice interview</option><option value="Profile">3 · Profile</option><option value="Match">4 · Swipe to match</option><option value="Chat">5 · Chat</option><option value="Game">6 · Word Hunt</option><option value="Meetup">7 · Meet in person</option><option value="Chats">8 · My chats</option><option value="Safety">9 · Scam check</option><option value="Friends">10 · My friends</option><option value="Games">11 · Games</option><option value="Meetups">12 · Meetups</option></select>
  <button type="button" id="restart">Start again</button>
</div>
<div class="stage"><div class="phone-wrap" id="wrap"><div class="phone"><div id="screen"></div></div></div></div>

<template id="tpl-Verify"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8F7; font-family: Lexend, system-ui, sans-serif; color: #12201F; display: flex; flex-direction: column; padding: 28px 24px 26px">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="13" cy="17" r="10" fill="none" stroke="#0E4D4A" stroke-width="3"></circle><circle cx="21" cy="17" r="10" fill="none" stroke="#E8833A" stroke-width="3"></circle></svg>
    <span style="font-size: 20px; font-weight: 700; color: #0E4D4A">Silverswipers</span>
  </div>

  <h1 style="margin: 24px 0 4px; font-size: 30px; font-weight: 700">Welcome!</h1>
  <p style="margin: 0; font-size: 18px; color: #4A5A58">Which language do you want to use?</p>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
      <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="{{l.style}}">{{l.label}}</button>
    </sc-for>
  </div>

  <div style="margin-top: 22px; background: #FFFFFF; border: 2px solid #DCE7E5; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 16px; background: #E5F1EF; color: #0E4D4A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      </div>
      <p style="margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3">Show you are a real person</p>
    </div>
    <p style="margin: 0; font-size: 17px; line-height: 1.45; color: #2D3B3A">Everyone on Silverswipers checks in with Singpass. This keeps out fake profiles and scammers.</p>
    <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; color: #2D3B3A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5 9-10"></path></svg>
      <span>Friends only see your name, age and town</span>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; color: #2D3B3A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5 9-10"></path></svg>
      <span>Your NRIC number is never shown to anyone</span>
    </div>
  </div>

  <div style="flex: 1"></div>

  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 18px; background: #0E4D4A; color: #FFFFFF; font-size: 21px; font-weight: 600; text-decoration: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path></svg>Verify with Singpass</a>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.4; text-align: center; color: #4A5A58">Need help? Staff at your Active Ageing Centre can do this with you.</p>
</div></template>
<template id="tpl-Main"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8F7; font-family: Lexend, system-ui, sans-serif; color: #12201F; display: flex; flex-direction: column; padding: 24px 24px 26px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="13" cy="17" r="10" fill="none" stroke="#0E4D4A" stroke-width="3"></circle><circle cx="21" cy="17" r="10" fill="none" stroke="#E8833A" stroke-width="3"></circle></svg>
      <span style="font-size: 20px; font-weight: 700; color: #0E4D4A">Silverswipers</span>
    </div>
    <div style="position: relative">
      <button type="button" onClick="{{toggleLang}}" aria-expanded="{{langOpen}}" aria-label="Change language" style="min-height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid #B9CCC9; background: #FFFFFF; font-size: 16px; color: #12201F; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E4D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>{{langLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{langOpenBool}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; right: 0; top: 52px; z-index: 5; width: 210px; background: #FFFFFF; border: 2px solid #DCE7E5; border-radius: 18px; padding: 6px; box-shadow: 0 8px 24px rgba(18,32,31,0.15); display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
            <button type="button" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 18px">
    <div style="flex: 1; height: 8px; border-radius: 4px; background: #D3E0DE; overflow: hidden" aria-hidden="true">
      <div style="width: 50%; height: 8px; background: #0E4D4A"></div>
    </div>
    <span style="font-size: 16px; color: #4A5A58">Question 3 of 6</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; margin-top: 14px">
    <div style="width: 150px; height: 150px; border-radius: 75px; background: {{ring2}}; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <div style="width: 120px; height: 120px; border-radius: 60px; background: {{ring1}}; display: flex; align-items: center; justify-content: center">
        <div style="width: 88px; height: 88px; border-radius: 44px; background: #0E4D4A; display: flex; align-items: center; justify-content: center; gap: 6px">
          <div style="width: 8px; height: {{b1}}px; border-radius: 4px; background: #FFFFFF"></div>
          <div style="width: 8px; height: {{b2}}px; border-radius: 4px; background: #FFFFFF"></div>
          <div style="width: 8px; height: {{b3}}px; border-radius: 4px; background: #FFFFFF"></div>
          <div style="width: 8px; height: {{b2}}px; border-radius: 4px; background: #FFFFFF"></div>
          <div style="width: 8px; height: {{b1}}px; border-radius: 4px; background: #FFFFFF"></div>
        </div>
      </div>
    </div>
    <p style="margin: 8px 0 0; font-size: 20px; font-weight: 600">Sunny</p>
    <p style="margin: 2px 0 0; font-size: 16px; color: #4A5A58">{{status}}</p>
  </div>

  <div style="margin-top: 10px; background: #FFFFFF; border: 2px solid #DCE7E5; border-radius: 22px; padding: 12px 16px">
    <p style="margin: 0; font-size: 15px; color: #4A5A58">Sunny asked</p>
    <p style="margin: 4px 0 0; font-size: 21px; line-height: 1.4; font-weight: 500">“What do you usually like to do on weekends, Uncle Tan?”</p>
  </div>

  <div style="margin-top: 10px; background: #E5F1EF; border-radius: 22px; padding: 12px 16px">
    <p style="margin: 0; font-size: 15px; color: #2F5F5B">You said</p>
    <p style="margin: 4px 0 0; font-size: 19px; line-height: 1.45; color: #0E3B39">“Saturday I play mahjong with my old colleagues. Sunday I go wet market, then water my plants...”</p>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Pause the interview" style="width: 64px; height: 64px; border-radius: 32px; border: 2px solid #B9CCC9; background: #FFFFFF; color: #2D3B3A; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
    </button>
    <button type="button" onClick="{{toggle}}" aria-pressed="{{pressed}}" aria-label="{{micLabel}}" style="width: 96px; height: 96px; border-radius: 48px; border: none; background: {{micBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>
    </button>
    <a href="Profile.dc.html" aria-label="Next" style="width: 64px; height: 64px; border-radius: 32px; border: 2px solid #0E4D4A; background: #E5F1EF; color: #0E4D4A; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>
  <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 15px; color: #2D3B3A; text-align: center">
    <span style="width: 64px">Pause</span>
    <span style="width: 96px">Tap to talk</span>
    <span style="width: 64px; font-weight: 600; color: #0E4D4A">Next</span>
  </div>
  <a href="#" style="display: block; margin-top: 4px; padding: 6px 0; text-align: center; font-size: 16px; color: #0E4D4A">Prefer to type instead</a>
  
</div></template>
<template id="tpl-Profile"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8F7; font-family: Lexend, system-ui, sans-serif; color: #12201F; display: flex; flex-direction: column; padding: 28px 22px 26px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 52px; height: 52px; border-radius: 26px; background: #0E4D4A; display: flex; align-items: center; justify-content: center; gap: 3px; flex-shrink: 0" aria-hidden="true">
      <div style="width: 5px; height: 10px; border-radius: 3px; background: #FFFFFF"></div>
      <div style="width: 5px; height: 18px; border-radius: 3px; background: #FFFFFF"></div>
      <div style="width: 5px; height: 10px; border-radius: 3px; background: #FFFFFF"></div>
    </div>
    <p style="margin: 0; font-size: 18px; line-height: 1.4; color: #2D3B3A">Thank you for chatting, Uncle Tan! Here is what I learned.</p>
  </div>

  <h1 style="margin: 22px 0 14px; font-size: 28px; font-weight: 700">Is this you?</h1>

  <div style="background: #FFFFFF; border: 2px solid #DCE7E5; border-radius: 24px; padding: 6px 18px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E5ECEB">
      <div>
        <p style="margin: 0; font-size: 15px; color: #4A5A58">You enjoy</p>
        <p style="margin: 3px 0 0; font-size: 19px; line-height: 1.4">Mahjong, gardening, going to the wet market</p>
      </div>
      <a href="#" style="font-size: 16px; padding: 10px 0; flex-shrink: 0">Change</a>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E5ECEB">
      <div>
        <p style="margin: 0; font-size: 15px; color: #4A5A58">You speak</p>
        <p style="margin: 3px 0 0; font-size: 19px; line-height: 1.4">Mandarin, Hokkien, some English</p>
      </div>
      <a href="#" style="font-size: 16px; padding: 10px 0; flex-shrink: 0">Change</a>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E5ECEB">
      <div>
        <p style="margin: 0; font-size: 15px; color: #4A5A58">Your sense of humour</p>
        <p style="margin: 3px 0 0; font-size: 19px; line-height: 1.4">Loves teasing and jokes</p>
      </div>
      <a href="#" style="font-size: 16px; padding: 10px 0; flex-shrink: 0">Change</a>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0">
      <div>
        <p style="margin: 0; font-size: 15px; color: #4A5A58">How you like to chat</p>
        <p style="margin: 3px 0 0; font-size: 19px; line-height: 1.4">Voice messages, in the morning</p>
      </div>
      <a href="#" style="font-size: 16px; padding: 10px 0; flex-shrink: 0">Change</a>
    </div>
  </div>

  <div style="margin-top: 14px; background: #FFF6EE; border: 2px solid #F3C9A4; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A3A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path></svg>
    <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #5C2C08">Only this summary is shown to others. Your voice recording is not shared.</p>
  </div>

  <div style="flex: 1"></div>

  <a href="Match.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 18px; background: #0E4D4A; color: #FFFFFF; font-size: 21px; font-weight: 600; text-decoration: none">Yes, find me friends</a>
  <a href="Main.dc.html" style="display: block; margin-top: 14px; text-align: center; font-size: 18px; color: #0E4D4A">Talk to Sunny again</a>
</div></template>
<template id="tpl-Match"><div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F4F8F7; font-family: Lexend, system-ui, sans-serif; color: #12201F; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 24px 0">
    <p style="margin: 0; font-size: 17px; color: #4A5A58">Good morning, Uncle Tan</p>
    <h1 style="margin: 2px 0 0; font-size: 27px; font-weight: 700">Someone you may like</h1>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 15px; color: #4A5A58">
      <span>← Swipe left to skip</span>
      <span>Swipe right to say hello →</span>
    </div>
  </div>

  <div style="position: relative; margin: 10px 20px 0; height: 500px">
    <div style="position: absolute; left: 12px; right: 12px; top: 12px; bottom: -8px; background: #E5ECEB; border-radius: 28px" aria-hidden="true"></div>

    <sc-if value="{{hasCard}}" hint-placeholder-val="{{true}}">
      <div onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="position: absolute; inset: 0; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; border: 2px solid #DCE7E5; padding: 20px; display: flex; flex-direction: column; gap: 14px; touch-action: none; user-select: none; cursor: grab; box-shadow: 0 6px 18px rgba(18,32,31,0.08); transform: {{tf}}; transition: {{tr}}">
        <sc-if value="{{showHello}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 22px; right: 20px; padding: 6px 14px; border: 3px solid #0E4D4A; color: #0E4D4A; border-radius: 12px; font-size: 20px; font-weight: 700; transform: rotate(8deg); background: #FFFFFF">HELLO!</span>
        </sc-if>
        <sc-if value="{{showSkip}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 22px; right: 20px; padding: 6px 14px; border: 3px solid #4A5A58; color: #4A5A58; border-radius: 12px; font-size: 20px; font-weight: 700; transform: rotate(-8deg); background: #FFFFFF">SKIP</span>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 14px">
          <div style="width: 80px; height: 80px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; flex-shrink: 0; background: {{p.bg}}; color: {{p.fg}}" role="img" aria-label="Profile photo">{{p.initials}}</div>
          <div>
            <p style="margin: 0; font-size: 25px; font-weight: 700">{{p.name}}</p>
            <p style="margin: 2px 0 0; font-size: 17px; color: #4A5A58">Lives in {{p.town}}</p>
            <p style="margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #2F6B4F">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Singpass verified</p>
          </div>
        </div>
        <div style="background: #E5F1EF; border-radius: 18px; padding: 12px 14px">
          <p style="margin: 0; font-size: 17px; line-height: 1.4; color: #0E3B39"><b>Why we matched you:</b> {{p.why}}</p>
        </div>
        <p style="margin: 0; font-size: 18px; line-height: 1.45">“{{p.quote}}”</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{p.tags}}" as="t" hint-placeholder-count="4">
            <span style="padding: 7px 13px; border-radius: 18px; background: #F1F4F3; font-size: 15px; color: #2D3B3A">{{t}}</span>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{noCard}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; border: 2px solid #DCE7E5; padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
        <p style="margin: 0; font-size: 24px; font-weight: 700">That's all for today</p>
        <p style="margin: 0; font-size: 18px; line-height: 1.45; color: #4A5A58">Come back tomorrow to meet new friends.</p>
        <button type="button" onClick="{{restart}}" style="margin-top: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; border: 2px solid #B9CCC9; background: #FFFFFF; font-size: 18px; color: #0E4D4A; cursor: pointer">See again</button>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; gap: 14px; padding: 20px 20px 0">
    <button type="button" onClick="{{skip}}" style="flex: 1; height: 62px; border-radius: 18px; border: 2px solid #B9CCC9; background: #FFFFFF; color: #2D3B3A; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Skip</button>
    <button type="button" onClick="{{hello}}" style="flex: 1.4; height: 62px; border-radius: 18px; border: none; background: #0E4D4A; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
